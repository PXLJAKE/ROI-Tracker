name: Release

on:
  # Neue Version in manifest.json auf main → Release wird automatisch erstellt
  push:
    branches: [main]
    paths:
      - custom_components/roi_tracker/manifest.json
  # Von Hand veröffentlichtes Release → ZIP anhängen
  release:
    types: [published]

permissions: {}

jobs:
  auto-release:
    name: Create release for new version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.version.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Read version
        id: version
        run: |
          version="$(jq -r .version custom_components/roi_tracker/manifest.json)"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create ZIP
        if: steps.version.outputs.exists == 'false'
        run: |
          cd custom_components/roi_tracker
          zip -r roi_tracker.zip ./ -x '*.pyc' -x '__pycache__/*'

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes="release-notes/${tag}.md"
          if [ -f "$notes" ]; then
            title="$(head -n 1 "$notes" | sed 's/^# *//')"
            tail -n +2 "$notes" > notes.tmp
            gh release create "$tag" custom_components/roi_tracker/roi_tracker.zip \
              --target "$GITHUB_SHA" --title "$title" --notes-file notes.tmp
          else
            gh release create "$tag" custom_components/roi_tracker/roi_tracker.zip \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi

  release-zip:
    name: Build release ZIP
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set version in manifest.json
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          jq --arg v "$version" '.version = $v' \
            custom_components/roi_tracker/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/roi_tracker/manifest.json

      - name: Create ZIP
        run: |
          cd custom_components/roi_tracker
          zip -r roi_tracker.zip ./ -x '*.pyc' -x '__pycache__/*'

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: custom_components/roi_tracker/roi_tracker.zip

  # Doku-Website als roi-tracker-docs-<version>.zip an das Release hängen.
  # Zwei Aufrufer, weil ein mit dem GITHUB_TOKEN erstelltes Release kein
  # "release: published" auslöst.
  docs-auto:
    name: Docs (automatisches Release)
    needs: auto-release
    if: needs.auto-release.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/docs-release.yml
    with:
      tag: ${{ needs.auto-release.outputs.tag }}

  docs-published:
    name: Docs (veröffentlichtes Release)
    if: github.event_name == 'release' && !github.event.release.prerelease
    permissions:
      contents: write
    uses: ./.github/workflows/docs-release.yml
    with:
      tag: ${{ github.event.release.tag_name }}
