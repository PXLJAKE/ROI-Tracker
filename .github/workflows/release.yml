name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-zip:
    name: Build release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version in manifest.json
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          jq --arg v "$version" '.version = $v' \
            custom_components/roi_tracker/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/roi_tracker/manifest.json

      - name: Create ZIP
        run: |
          cd custom_components/roi_tracker
          zip -r roi_tracker.zip ./ -x '*.pyc' -x '__pycache__/*'

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/roi_tracker/roi_tracker.zip
