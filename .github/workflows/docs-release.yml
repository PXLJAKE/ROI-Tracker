name: Docs release

# Baut die Doku-Website für ein veröffentlichtes Release (keine Vorabversion)
# und hängt sie als roi-tracker-docs-<version>.zip an. Im ZIP liegt genau ein
# Ordner roi-tracker/, der in den docs-Ordner der Website kopiert wird.
#
# Aufgerufen aus release.yml (automatisches und von Hand veröffentlichtes
# Release) oder von Hand über "Run workflow" mit einem Release-Tag.

on:
  workflow_call:
    inputs:
      tag:
        description: Release-Tag, z. B. v0.5.1
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release-Tag, z. B. v0.5.1
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build docs ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write # ZIP an das Release hängen
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Release prüfen
        run: |
          if ! [[ "$TAG" =~ ^v?[0-9]+(\.[0-9]+)*([.+-][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Ungültiger Tag: $TAG"; exit 1
          fi
          info="$(gh release view "$TAG" --json isDraft,isPrerelease)"
          if [ "$(jq -r .isDraft <<<"$info")" = "true" ] || [ "$(jq -r .isPrerelease <<<"$info")" = "true" ]; then
            echo "::error::$TAG ist ein Entwurf oder eine Vorabversion – Doku wird nur für veröffentlichte Releases gebaut."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs (gepinnt, mit Hashes)
        run: pip install --require-hashes -r requirements-docs.txt

      - name: Build + ZIP
        run: python scripts/build_docs.py --zip "$TAG"

      - name: Links unter /docs/roi-tracker/ prüfen
        run: python scripts/check_docs_links.py

      - name: An das Release hängen
        run: gh release upload "$TAG" "dist-docs/roi-tracker-docs-${TAG#v}.zip" --clobber
